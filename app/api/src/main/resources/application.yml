spring:
  application:
    name: scanit-platform
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:app/api/.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: email-smtp.us-east-1.amazonaws.com
    port: 587
    username: ${AWS_SES_SMTP_USERNAME}
    password: ${AWS_SES_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      ses:
        from: ${APP_EMAIL_FROM:noreply@scanit.com}
      s3:
        receipts-bucket: ${AWS_S3_RECEIPT_BUCKET:local-receipts-bucket}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  ocr:
    mock-enabled: true

  email:
    from: ${APP_EMAIL_FROM:noreply@scanit.com}
    delivery-enabled: ${APP_EMAIL_DELIVERY_ENABLED:false}
  base-url: ${BASE_URL:http://localhost:3000}
  categories:
    max-name-length: ${APP_CATEGORIES_MAX_NAME_LENGTH:100}

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO
