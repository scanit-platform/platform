spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scanit_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    show-sql: false
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      ses:
        from: ${APP_EMAIL_FROM}
      s3:
        receipts-bucket: ${AWS_S3_RECEIPT_BUCKET}

app:
  ocr:
    mock-enabled: false
  base-url: ${BASE_URL}
  email:
    from: ${APP_EMAIL_FROM}
    delivery-enabled: ${APP_EMAIL_DELIVERY_ENABLED:true}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      expiration: ${APP_SECURITY_JWT_EXPIRATION}
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${APP_SECURITY_CORS_ALLOWED_HEADERS:*}
      exposed-headers: ${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization,Location}

logging:
  level:
    org.springframework.transaction.interceptor: INFO
    org.springframework.orm.jpa.JpaTransactionManager: INFO
    org.springframework.jdbc.datasource.init: INFO
