spring.datasource.url=jdbc:h2:mem:scanit-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=test-signing-secret-key-with-32-bytes
app.security.jwt.expiration=24h

# Dummy AWS/SES values so the application context loads without real credentials in CI.
spring.cloud.aws.credentials.access-key=test-access-key
spring.cloud.aws.credentials.secret-key=test-secret-key
spring.cloud.aws.region.static=us-east-1

spring.mail.username=test-smtp-user
spring.mail.password=test-smtp-password
