services:
  postgres:
    image: postgres:17-alpine
    container_name: scanit-postgres
    restart: unless-stopped

    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-scanit_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-scanit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: scanit-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-scanit_db}
  
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    container_name: scanit-web
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data: